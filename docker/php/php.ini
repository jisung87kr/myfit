; PHP configuration for MyFit application

; POST/Upload limits
post_max_size = 128M
upload_max_filesize = 128M
max_input_vars = 5000

; Memory and execution limits
memory_limit = 512M
max_execution_time = 600
max_input_time = 600

; Error handling
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Date/Time
date.timezone = Asia/Seoul